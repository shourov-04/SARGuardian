name: SARGuardian API — import and tests

on:
  pull_request:
    branches: [main]
    paths:
      - "apps/api/**"
      - "engines/**"
      - "science/**"
      - ".github/workflows/api-validation.yml"
  push:
    branches: [main]
    paths:
      - "apps/api/**"
      - "engines/**"
      - "science/**"
      - ".github/workflows/api-validation.yml"

permissions:
  contents: read

concurrency:
  group: sarguardian-api-${{ github.ref }}
  cancel-in-progress: true

jobs:
  api-tests:
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    defaults:
      run:
        working-directory: apps/api
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: apps/api/requirements-test.txt
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Install API and test dependencies
        run: python -m pip install -r requirements-test.txt
      - name: Validate API imports
        run: python -c "from app.main import app; print(app.title)"
      - name: Run API test suite
        run: python -m pytest -q
      - name: Test Google Maps dashboard adapter contract
        run: node tests/google_maps_dashboard_adapter.test.mjs
