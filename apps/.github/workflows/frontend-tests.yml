name: SARGuardian web — build, lint and tests

on:
  pull_request:
    branches: [main]
    paths:
      - "apps/web/**"
      - "apps/.github/workflows/frontend-tests.yml"
  push:
    branches: [main]
    paths:
      - "apps/web/**"
      - "apps/.github/workflows/frontend-tests.yml"

permissions:
  contents: read

concurrency:
  group: sarguardian-web-${{ github.ref }}
  cancel-in-progress: true

jobs:
  frontend:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    defaults:
      run:
        working-directory: apps/web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: apps/web/package-lock.json
      - name: Install locked dependencies
        run: npm ci
      - name: Type-check and production build
        run: npm run build
      - name: Lint
        run: npm run lint
      - name: Unit tests
        run: npm run test
